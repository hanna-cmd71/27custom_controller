            - name: axf to elf
              abortAfterFailed: false
              command: '"D:\K5\ARM\ARMCLANG\bin\fromelf.exe" --elf -o ${OutDir}\${ProjectName}.elf ${OutDir}\${ProjectName}.axf'
              disable: false
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295 --diag_error=warning
